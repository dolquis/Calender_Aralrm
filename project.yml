name: ShiftAlarm
options:
  bundleIdPrefix: com.example.shiftalarm
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

fileGroups:
  - project.yml
  - README.md
  - README.ja.md
  - scripts

targets:
  ShiftAlarm:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
      - path: Sources
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: シフトアラーム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations:
          - en
          - ja
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        NSAlarmKitUsageDescription: シフトに合わせて目覚ましを鳴らすために使用します。
        NSCalendarsFullAccessUsageDescription: シフトカレンダーの祝日をアラームに反映するために使用します。
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.shiftalarm.refreshAlarms
        CFBundleURLTypes:
          - CFBundleURLName: com.example.shiftalarm.url
            CFBundleURLSchemes:
              - shiftalarm
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.example.shiftalarm.bundle
            UTTypeDescription: Shift Alarm Bundle
            UTTypeConformsTo:
              - public.json
            UTTypeTagSpecification:
              public.filename-extension:
                - shiftalarm
              public.mime-type:
                - application/json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shiftalarm
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/ShiftAlarm.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: '"App/Preview Content"'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - target: ShiftAlarmWidget
      - sdk: EventKit.framework

  ShiftAlarmWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Widget
      - path: Sources/Domain
      - path: Sources/Services/LiveActivity
      - path: Sources/Shared/Extensions
      - path: Resources/Localizable.xcstrings
        optional: true
    info:
      path: Widget/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shiftalarm.widget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/ShiftAlarmWidget.entitlements
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  ShiftAlarmTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shiftalarm.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ShiftAlarm

schemes:
  ShiftAlarm:
    build:
      targets:
        ShiftAlarm: all
        ShiftAlarmWidget: all
        ShiftAlarmTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShiftAlarmTests
    archive:
      config: Release
