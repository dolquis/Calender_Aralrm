name: iOS CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-test:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "Xcode $version"
          major="${version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Xcode 26.0 or newer is required." >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: bash scripts/bootstrap.sh

      - name: Install iOS simulator runtime
        run: |
          set -euo pipefail
          attempt=1
          max_attempts=3
          delay=15
          until sudo xcodebuild -downloadPlatform iOS; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "iOS simulator runtime download failed after $attempt attempts." >&2
              exit 1
            fi
            echo "Download attempt $attempt failed; retrying in ${delay}s..." >&2
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 2))
          done

      - name: Build and test
        run: |
          set -o pipefail
          bash scripts/verify.sh 2>&1 | tee verify.log

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            verify.log
            DerivedData/Logs/Test/*.xcresult
            DerivedData/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7

  lint:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          for app in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.app \
            /Applications/Xcode_26.0.app \
            /Applications/Xcode.app
          do
            if [ -d "$app" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              break
            fi
          done
          version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          echo "Xcode $version"
          major="${version%%.*}"
          if [ "$major" -lt 26 ]; then
            echo "Xcode 26.0 or newer is required." >&2
            exit 1
          fi

      - name: Lint Swift sources
        run: bash scripts/lint.sh check

  quality:
    # Cross-platform checks that do not need Xcode; run on Linux so they
    # mirror what is available in the Claude Code on the web cloud sandbox.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          set -euo pipefail
          ver="8.30.1"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          curl -fsSL "$url" -o /tmp/gitleaks.tgz
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks

      - name: Secret scan (gitleaks)
        run: bash scripts/scan-secrets.sh

      - name: Spell check sources (typos)
        uses: crate-ci/typos@v1.47.2
        with:
          files: Sources App Widget Tests scripts
